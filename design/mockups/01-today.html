<body class="doc">
<div class="wrap">
<h1>1 · Today</h1>
<p class="lede">Home screen of the app. One green key fills the daily budget: due reviews, then new cards, then the main block. Every number is a measured fact. Numbers on this page are demo values; German text is from Wiktionary and Tatoeba.</p>

<h2 class="grp-title">Session states</h2>
<div class="row">
<figure><div class="ph light" data-tab="today" data-inbox="3"><div class="scr pad-tabs">
  <div class="navrow"><span></span><span class="rkey" aria-label="Status and data"><i data-i="stats"></i></span></div>
  <div class="ltitle"><div class="t-large">Today</div><div class="sub">Saturday 3 October</div></div>
  <div class="sh"><span>Session · about 30 min</span></div>
  <div class="grp">
    <div class="cl"><span class="lamp on"></span><div class="ct"><b>Reviews</b><span>42 due</span></div><span class="det">~14 min</span></div>
    <div class="cl"><span class="lamp"></span><div class="ct"><b>New cards</b><span>10 · lecture 08 and Inbox</span></div><span class="det">~6 min</span></div>
    <div class="cl"><span class="lamp"></span><div class="ct"><b>Lecture 09</b><span>Resume at 3:20 of 9:45</span></div><span class="chip" style="min-height:30px;font-size:.78rem"><i data-i="swap"></i>Swap</span></div>
  </div>
  <div style="padding:16px 16px 0"><div class="go"><span>Start session</span><i data-i="play"></i></div></div>
  <div class="sh" style="padding-top:24px"><span>Also</span></div>
  <div class="grp">
    <div class="cl"><i data-i="inbox"></i><div class="ct"><b>Inbox</b></div><span class="det">3</span><i data-i="chev"></i></div>
    <div class="cl"><i data-i="note"></i><div class="ct"><b>Reviews only</b></div><i data-i="chev"></i></div>
  </div>
  <div class="foot">Time today: 0 min. Last backup 5 days ago.</div>
</div></div><figcaption><b>Fresh day</b>Next block's lamp is lit. Swap changes the main block. Time estimates use your own measured pace.</figcaption></figure>

<figure><div class="ph dark" data-tab="today" data-mini="paused" data-inbox="3"><div class="scr pad-mini">
  <div class="navrow"><span></span><span class="rkey" aria-label="Status and data"><i data-i="stats"></i></span></div>

    <div class="cl"><span class="lamp"></span><div class="ct"><b>Lecture 09</b><span>Resume at 3:20 of 9:45</span></div><span class="det">~7 min</span></div>

  <div class="sh" style="padding-top:24px"><span>Also</span></div>
  <div class="grp">
    <div class="cl"><i data-i="inbox"></i><div class="ct"><b>Inbox</b></div><span class="det">3</span><i data-i="chev"></i></div>
  </div>

</div></div><figcaption><b>Mid-session, lecture loaded</b>Done block shows a solid lamp and its real time. The mini-player docks above the tab bar while a lecture is loaded.</figcaption></figure>

<figure><div class="ph light" data-tab="today" data-inbox="3"><div class="scr">
  <div class="navrow"><span></span><span class="rkey"><i data-i="stats"></i></span></div>

  <div class="sh"><span>Session · about 30 min</span></div>

    <div class="cl"><span class="lamp"></span><div class="ct"><b>New cards</b><span>None today · reviews fill the budget</span></div><span class="det">0</span></div>
    <div class="cl"><span class="lamp"></span><div class="ct"><b>Lecture 10</b><span>5:44</span></div><span class="det">~8 min</span></div>
  </div>

  <div class="sheet">
    <div class="grab"></div>
    <div class="t-title3">Main block</div>

    <div class="grp flush" style="margin:14px 0 0;background:var(--bg)">
      <div class="cl sel"><span style="color:var(--label);width:22px;height:22px;display:grid;place-items:center"><i data-i="check"></i></span><div class="ct"><b>Lecture 10</b><span>Language Transfer · next track</span></div><span class="det">5:44</span></div>

    </div>
    <div class="acts"><div class="key2">Done</div></div>
  </div>
</div></div><figcaption><b>Heavy day, swap sheet open</b>Reviews are capped at the budget and the carry-over is stated plainly; new cards drop to zero automatically. Swap offers only what's available today.</figcaption></figure>

<figure><div class="ph light" data-tab="today"><div class="scr pad-tabs">
  <div class="navrow"><span></span><span class="rkey"><i data-i="stats"></i></span></div>
  <div class="ltitle"><div class="t-large">Today</div><div class="sub">Thursday 3 December</div></div>
  <div class="sh"><span>Session · about 30 min</span><span>12 min left</span></div>
  <div class="grp">
    <div class="cl done"><span class="lamp done"></span><div class="ct"><b>Reviews</b><span>51 done</span></div><span class="det">15 min</span></div>

      <div class="t-sub">You opened this lesson on the DW website. Mark it done?</div>

    </div>
  </div>

</div></div><figcaption><b>Nicos Weg block, back from the website</b>The question stays inline until answered, so it never depends on detecting your return (Phase 0 check 12).</figcaption></figure>
</div>
