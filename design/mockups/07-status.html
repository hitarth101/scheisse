<style>
.fc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 96px; padding: 0 18px; }
.fc div { display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; height: 100%; }
.fc i { width: 100%; max-width: 28px; border-radius: 6px 6px 2px 2px; background: var(--fill-press); display: block; }
.fc i.now { background: var(--label-2); }
.fc b { font-size: .765rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.fcl { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 6px 18px 14px; font-size: .765rem; color: var(--label-2); text-align: center; }
.big { font-size: 1.647rem; font-weight: 700; letter-spacing: -.015em; font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; justify-content: space-between; }

<div class="wrap">
<h1>7 · Status and data</h1>
<p class="lede">Plain numbers, backup, settings and outside links. Reached from the key at the top right of Today. Every number here is a count or a duration; none is a score. All values are demo values.</p>
<div class="row">
<figure><div class="ph light" data-backdrop><div class="scr" style="padding-bottom:30px">
  <div class="navrow"><span class="back"><i data-i="back"></i>Today</span><span></span></div>
  <div class="ltitle"><div class="t-large">Status</div></div>
  <div class="sh"><span>Reviews</span><span>next 7 days</span></div>
  <div class="grp" style="padding-top:14px">
    <div class="fc">
      <div><b>42</b><i class="now" style="height:62%"></i></div><div><b>37</b><i style="height:54%"></i></div><div><b>41</b><i style="height:60%"></i></div><div><b>28</b><i style="height:41%"></i></div><div><b>33</b><i style="height:48%"></i></div><div><b>45</b><i style="height:66%"></i></div><div><b>30</b><i style="height:44%"></i></div>
    </div>
    <div class="fcl"><span>Today</span><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span></div>
  </div>
  <div class="sh"><span>Cards</span><span>1,519 in total</span></div>
  <div class="grp flush">
    <div class="cl"><div class="ct"><b>New, not yet seen</b></div><span class="det">1,180</span></div>
    <div class="cl"><div class="ct"><b>Learning</b></div><span class="det">24</span></div>
    <div class="cl"><div class="ct"><b>In review</b></div><span class="det">312</span></div>
    <div class="cl"><div class="ct"><b>Suspended</b><span>3 leeches, 0 flagged</span></div><span class="det">3</span><i data-i="chev"></i></div>
  </div>
  <div class="sh"><span>Words known</span></div>
  <div class="grp flush">
    <div class="cl"><div class="ct"><b>From reviews</b><span>review gap of 21 days or more</span></div><span class="det">186</span></div>
    <div class="cl"><div class="ct"><b>Marked known in Reading</b></div><span class="det">41</span></div>
  </div>
</div></div><figcaption><b>Overview</b>The forecast is a labelled count per day, no trend lines or targets. Words known are two separate counts, as the product spec defines.</figcaption></figure>

<figure><div class="ph light" data-backdrop><div class="scr" style="padding-bottom:30px">

<figure><div class="ph light"><div class="scr">

</div></div><figcaption><b>Restore: confirm</b>Names the backup's date and contents and what will be lost. The destructive key is red text on a plain key, never the green key.</figcaption></figure>
